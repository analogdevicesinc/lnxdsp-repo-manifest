# Upstream layers and configuration for ADSP-SC5xx/SC8xx reference boards
# (yocto wrynose). Does not declare meta-adi, the including file does, so
# lnxdsp-adi-meta can build its own checkout. Mirrors main.xml.

header:
  version: 14

machine: adsp-sc598-som-ezkit
distro: adi-distro-glibc
target: adsp-sc5xx-minimal

repos:
  # yocto wrynose 6.0.3
  bitbake:
    url: https://git.openembedded.org/bitbake
    commit: fae9db3168dbff1b8c76fe9c6726a9687ff97514
    layers:
      .: excluded

  oe-core:
    url: https://git.openembedded.org/openembedded-core
    commit: ef022bf82d79015802309d14c28b13373ebe53f5
    layers:
      meta:

  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    commit: 1b132647002eea43a2c7a7f857f63f42dacbc26c
    layers:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded
    commit: 14282a02be9c74a1276a7cda7d6c89e054699a11
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-multimedia:

  meta-arm:
    url: https://git.yoctoproject.org/meta-arm
    commit: 9dab8bdd4991973faa6dfc5b3c607f4c09cc1cdb
    layers:
      meta-arm:
      meta-arm-toolchain:

local_conf_header:
  adi: |
    PACKAGE_CLASSES ?= "package_ipk"
    DISTRO_FEATURES:append = " linux_only_audio "
    ADI_ELFLOADER_AGREE_SLA:adsp-sc598-som-ezkit = "1"
    ADI_ELFLOADER_AGREE_SLA:adsp-sc598-som-ezlite = "1"
  wrynose-workarounds: |
    # TODO: drop once systemd.bbclass guards this append with class-native.
    # util-linux-native and systemd-systemctl-native depend on each other, and
    # create-spdx-3.0 makes that a fatal task cycle.
    DEPENDS:remove:class-native = "systemd-systemctl-native"
    # TODO: drop when meta-oe stops asking for uutils-coreutils-native, or
    # systemd gains a native variant.
    BBMASK += "meta-oe/recipes-core/uutils-coreutils/"
